<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <!-- Deep phantom obsidian ambient glow -->
    <radialGradient id="phantom-glow" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>

    <!-- Crimson & Cyan Laser Beam -->
    <linearGradient id="cyber-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff2a5f" stop-opacity="1"/>
      <stop offset="75%" stop-color="#e11d48" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Background Cybernetic Circuit Pattern -->
    <pattern id="pcb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141824" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.2" fill="#222b40" opacity="0.8"/>
    </pattern>

    <!-- Clip card border -->
    <clipPath id="card-clip">
      <rect width="920" height="310" rx="16"/>
    </clipPath>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-920px); }
        100% { transform: translateX(920px); }
      }
      @keyframes pulse-red {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 42, 95, 0.8)); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 2px rgba(255, 42, 95, 0.2)); }
      }
      @keyframes glitch-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 42, 95, 0.6)); }
        50% { filter: drop-shadow(0 0 10px rgba(255, 42, 95, 0.95)); }
      }
      .laser-sweep {
        animation: sweep 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .red-beacon {
        animation: pulse-red 1.6s ease-in-out infinite;
      }
      .glitch-crack {
        animation: glitch-glow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="920" height="310" rx="16" fill="#08090d"/>
  <rect width="920" height="310" rx="16" fill="url(#pcb-grid)"/>
  <rect width="920" height="310" rx="16" fill="url(#phantom-glow)"/>

  <!-- Top animated laser beam border -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="920" height="1" fill="#1b1e2e"/>
    <rect class="laser-sweep" x="0" y="0" width="460" height="2.5" fill="url(#cyber-beam)"/>
  </g>

  <!-- Corner Precision Accents -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" stroke="#252b3d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 896 36 L 896 24 L 884 24" fill="none" stroke="#252b3d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 274 L 24 286 L 36 286" fill="none" stroke="#252b3d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 896 274 L 896 286 L 884 286" fill="none" stroke="#252b3d" stroke-width="1.5" stroke-linecap="round"/>

  <!-- PCB Circuit Trace Elements (PFP Match) -->
  <g stroke="#1e263c" stroke-width="1.2" fill="none">
    <path d="M 680 70 L 740 70 L 760 90 L 850 90"/>
    <circle cx="850" cy="90" r="3" fill="#38bdf8" stroke="none" opacity="0.6"/>
    <path d="M 720 180 L 770 180 L 785 195 L 860 195"/>
    <circle cx="860" cy="195" r="3" fill="#ff2a5f" stroke="none" opacity="0.6"/>
    <text x="790" y="66" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" stroke="none">[&gt;_SYS_NODE]</text>
  </g>

  <!-- Top Status Pill (Left) -->
  <g transform="translate(48, 30)">
    <rect width="232" height="28" rx="14" fill="#0d0f18" stroke="#1f2538" stroke-width="1"/>
    <circle class="red-beacon" cx="16" cy="14" r="4.5" fill="#ff2a5f"/>
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">CYBER-PHANTOM // ONLINE</text>
  </g>

  <!-- Author ID Badge (Right) -->
  <g transform="translate(684, 30)">
    <rect width="188" height="28" rx="14" fill="#131018" stroke="#311928" stroke-width="1"/>
    <text x="16" y="18" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.8">ID: 307824291 // VARSHU</text>
  </g>

  <!-- Stylized Mask Vector Motif (Direct PFP Tribute) -->
  <g transform="translate(735, 95)">
    <!-- Hood Shadow -->
    <path d="M 60 10 C 20 10 5 45 5 95 C 5 125 35 150 60 150 C 85 150 115 125 115 95 C 115 45 100 10 60 10 Z" fill="#0f121b" stroke="#1e2538" stroke-width="2"/>
    <!-- White Porcelain Mask -->
    <path d="M 60 25 C 35 25 24 50 24 85 C 24 110 45 130 60 130 C 75 130 96 110 96 85 C 96 50 85 25 60 25 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Hollow Eyes -->
    <ellipse cx="44" cy="76" rx="9" ry="14" fill="#08090d" transform="rotate(-12 44 76)"/>
    <ellipse cx="76" cy="76" rx="9" ry="14" fill="#08090d" transform="rotate(12 76 76)"/>
    <!-- Crimson Lightning Fracture (The Signature PFP Crack) -->
    <path class="glitch-crack" d="M 58 26 L 53 45 L 61 60 L 52 78 L 57 95 L 48 115 L 53 129" fill="none" stroke="#ff2a5f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 61 60 L 70 70 L 66 82" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Main Hero Title & Tagline -->
  <text x="48" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    VARSHU <tspan fill="#ff2a5f">DEV</tspan>
  </text>
  <text x="50" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
    Software Architect · Systems Engineer · Sovereign Creator
  </text>

  <!-- Bottom Specification Chips -->
  <g transform="translate(48, 222)">
    <!-- Chip 1 -->
    <rect width="168" height="34" rx="8" fill="#0d101a" stroke="#1d2338" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#38bdf8"/>
    <text x="28" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">ANDROID &amp; KOTLIN</text>

    <!-- Chip 2 -->
    <rect x="180" y="0" width="168" height="34" rx="8" fill="#0d101a" stroke="#1d2338" stroke-width="1"/>
    <circle cx="196" cy="17" r="3.5" fill="#ff2a5f"/>
    <text x="208" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">NEXT.JS 16 &amp; REACT</text>

    <!-- Chip 3 -->
    <rect x="360" y="0" width="162" height="34" rx="8" fill="#0d101a" stroke="#1d2338" stroke-width="1"/>
    <circle cx="376" cy="17" r="3.5" fill="#a855f7"/>
    <text x="388" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">AUDIO DSP &amp; MEDIA3</text>

    <!-- Chip 4 -->
    <rect x="534" y="0" width="160" height="34" rx="8" fill="#0d101a" stroke="#1d2338" stroke-width="1"/>
    <circle cx="550" cy="17" r="3.5" fill="#10b981"/>
    <text x="562" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">SYSTEMS &amp; REVERSE</text>

    <!-- Chip 5 -->
    <rect x="706" y="0" width="166" height="34" rx="8" fill="#0d101a" stroke="#1d2338" stroke-width="1"/>
    <circle cx="722" cy="17" r="3.5" fill="#f59e0b"/>
    <text x="734" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">0% YAP // 100% SHIP</text>
  </g>
</svg>
