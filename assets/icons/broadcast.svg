<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes pulse-wave-1 {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulse-wave-2 {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.95); }
      }
      .wave1 {
        animation: pulse-wave-1 1.6s ease-in-out infinite;
        transform-origin: 12px 12px;
      }
      .wave2 {
        animation: pulse-wave-2 1.6s ease-in-out infinite;
        transform-origin: 12px 12px;
      }
    </style>
  </defs>
  <!-- Center Node -->
  <circle cx="12" cy="12" r="3" fill="#ff2a5f"/>
  <circle cx="12" cy="12" r="1.5" fill="#ffffff"/>
  <!-- Radiating Radar Waves -->
  <path class="wave1" d="M 7 7 A 7 7 0 0 1 17 7 M 7 17 A 7 7 0 0 0 17 17" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
  <path class="wave2" d="M 4 4 A 11 11 0 0 1 20 4 M 4 20 A 11 11 0 0 0 20 20" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
</svg>
