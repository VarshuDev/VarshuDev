<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="eqMini" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#20cfff"/>
      <stop offset="100%" stop-color="#ff2daa"/>
    </linearGradient>
    <style>
      @keyframes eq1 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 16px; y: 4px; } }
      @keyframes eq2 { 0%, 100% { height: 14px; y: 6px; } 50% { height: 8px; y: 12px; } }
      @keyframes eq3 { 0%, 100% { height: 8px; y: 12px; } 50% { height: 18px; y: 2px; } }
      @keyframes eq4 { 0%, 100% { height: 16px; y: 4px; } 50% { height: 6px; y: 14px; } }
      .b1 { animation: eq1 1.1s ease-in-out infinite; }
      .b2 { animation: eq2 0.85s ease-in-out infinite; }
      .b3 { animation: eq3 1.3s ease-in-out infinite; }
      .b4 { animation: eq4 0.95s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="b1" x="2" y="14" width="3.5" height="6" rx="1.5" fill="url(#eqMini)"/>
  <rect class="b2" x="7.5" y="6" width="3.5" height="14" rx="1.5" fill="url(#eqMini)"/>
  <rect class="b3" x="13" y="12" width="3.5" height="8" rx="1.5" fill="url(#eqMini)"/>
  <rect class="b4" x="18.5" y="4" width="3.5" height="16" rx="1.5" fill="url(#eqMini)"/>
</svg>
