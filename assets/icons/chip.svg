<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes core-pulse {
        0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.5)); }
        50% { fill: #ff2a5f; filter: drop-shadow(0 0 6px rgba(255, 42, 95, 0.9)); }
      }
      @keyframes pin-signal {
        0%, 100% { stroke: #334155; }
        50% { stroke: #38bdf8; }
      }
      .core { animation: core-pulse 2s ease-in-out infinite; }
      .pins { animation: pin-signal 2s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Silicon Base -->
  <rect x="5" y="5" width="14" height="14" rx="2.5" fill="#0c0e18" stroke="#1e263d" stroke-width="1.5"/>
  <!-- Glowing Logic Core -->
  <rect class="core" x="8.5" y="8.5" width="7" height="7" rx="1.5"/>
  <!-- Surrounding Pins -->
  <g class="pins" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="2" x2="8" y2="5"/>
    <line x1="12" y1="2" x2="12" y2="5"/>
    <line x1="16" y1="2" x2="16" y2="5"/>
    <line x1="8" y1="19" x2="8" y2="22"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="16" y1="19" x2="16" y2="22"/>
    <line x1="2" y1="8" x2="5" y2="8"/>
    <line x1="2" y1="12" x2="5" y2="12"/>
    <line x1="2" y1="16" x2="5" y2="16"/>
    <line x1="19" y1="8" x2="22" y2="8"/>
    <line x1="19" y1="12" x2="22" y2="12"/>
    <line x1="19" y1="16" x2="22" y2="16"/>
  </g>
</svg>
