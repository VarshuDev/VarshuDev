<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
    <style>
      @keyframes float-box {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        50% { transform: translateY(-1.5px); filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.9)); }
      }
      @keyframes pulse-code {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .compiler-box {
        animation: float-box 2.2s ease-in-out infinite;
      }
      .code-pulse {
        animation: pulse-code 1.4s ease-in-out infinite;
      }
    </style>
  </defs>
  <g class="compiler-box">
    <!-- Studio Diamond / Hexagon Matrix -->
    <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="#0d111d" stroke="url(#compGrad)" stroke-width="1.6"/>
    <!-- Inner faceted folds -->
    <line x1="12" y1="2" x2="12" y2="12" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <line x1="12" y1="12" x2="21" y2="17" stroke="#ff2a5f" stroke-width="1.2" opacity="0.8"/>
    <line x1="12" y1="12" x2="3" y2="17" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
    <!-- Glowing Core Node -->
    <circle class="code-pulse" cx="12" cy="12" r="2.5" fill="#ffffff"/>
  </g>
</svg>
