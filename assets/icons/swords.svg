<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes spin-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-blade {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 42, 95, 0.6)); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 6px rgba(255, 42, 95, 1)); opacity: 1; }
      }
      .ring-spin {
        animation: spin-ring 6s linear infinite;
        transform-origin: 12px 12px;
      }
      .blade {
        animation: pulse-blade 1.8s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Cyber crosshair ring -->
  <circle class="ring-spin" cx="12" cy="12" r="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4, 3" opacity="0.6"/>
  <!-- Crossed Cyber Energy Blades -->
  <g class="blade">
    <path d="M 4 4 L 14 14 M 14 14 L 20 20 M 13 15 L 15 13 M 3 5 L 5 3" stroke="#ff2a5f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 4 L 10 14 M 10 14 L 4 20 M 9 13 L 11 15 M 21 5 L 19 3" stroke="#ff2a5f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2" fill="#ffffff"/>
  </g>
</svg>
